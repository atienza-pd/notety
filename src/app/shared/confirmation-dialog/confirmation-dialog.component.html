<!-- Modal with backdrop -->
<div
  class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4"
  [attr.aria-labelledby]="'confirmation-dialog-title'"
  (click)="onBackdropClick()"
>
  <div
    class="w-full max-w-md rounded-lg bg-white shadow-lg relative"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div
      class="px-6 py-4 border-b border-gray-200 flex items-center justify-between"
    >
      <h2
        id="confirmation-dialog-title"
        class="text-lg font-semibold text-gray-900"
      >
        {{ title() }}
      </h2>
      <button
        type="button"
        class="inline-flex items-center justify-center rounded-md p-1 text-gray-500 hover:text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        aria-label="Close"
        (click)="onClose()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 20 20"
          fill="currentColor"
          class="w-5 h-5"
        >
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 0 1 1.414 0L10 8.586l4.293-4.293a1 1 0 1 1 1.414 1.414L11.414 10l4.293 4.293a1 1 0 0 1-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 0 1-1.414-1.414L8.586 10 4.293 5.707a1 1 0 0 1 0-1.414Z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="px-6 py-4">
      <p class="text-sm text-gray-700">
        {{ message() }}
      </p>
    </div>

    <!-- Footer with buttons aligned to bottom right -->
    <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
      <button
        type="button"
        class="inline-flex items-center rounded-md px-4 py-2 text-sm font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors"
        [class]="cancelButtonClass()"
        (click)="onCancel()"
      >
        {{ cancelButtonText() }}
      </button>
      <button
        type="button"
        class="inline-flex items-center rounded-md px-4 py-2 text-sm font-semibold shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors"
        [class]="confirmButtonClass()"
        (click)="onConfirm()"
      >
        {{ confirmButtonText() }}
      </button>
    </div>
  </div>
</div>
